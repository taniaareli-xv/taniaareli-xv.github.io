
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitación bloqueada</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
}

.container {
    width: 100%;
    max-width: 440px;
    background: #fff;
    border-radius: 12px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 5px 25px rgba(0,0,0,0.06);
}

.icon {
    width: 68px;
    height: 68px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: #fff0f0;
    color: #d93636;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
}

h1 {
    font-size: 24px;
    color: #252525;
    margin-bottom: 14px;
}

.description {
    color: #686868;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 25px;
}

.status {
    background: #fff3f3;
    color: #c53030;
    padding: 12px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 22px;
}

.footer {
    border-top: 1px solid #eee;
    padding-top: 18px;
    font-size: 12px;
    color: #999;
}

@media(max-width: 480px) {
    .container {
        padding: 32px 22px;
    }

    h1 {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="icon">🔒</div>

    <h1>Invitación temporalmente bloqueada</h1>

    <p class="description">
        El acceso a esta invitación ha sido suspendido
        debido a que no se ha registrado el pago correspondiente.
    </p>

    <div class="status">
        ESTADO: PAGO PENDIENTE
    </div>

    <p class="description">
        Para restablecer el acceso, es necesario completar
        el pago correspondiente.
    </p>

    <div class="footer">
        Sistema de gestión de invitaciones
    </div>

</div>

</body>
</html>
